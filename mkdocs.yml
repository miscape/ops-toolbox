site_name: Operational Toolbox
site_description: Tools for sysadmin, DevOps and Kubernetes
site_author: Mirko

theme:
  name: material
  language: it
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Passa alla modalità scura

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Passa alla modalità chiara

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md

  - Kubernetes: 
    - Calico CNI: kubernetes/calico.md
    - Local Path Provisioner: kubernetes/local-path-provisioner.md
    - Envoy Gateway: kubernetes/envoy-gateway.md
    - Dynamic NFS Provisioner: kubernetes/dynamic-nfs-provisioner.md

  - Troubleshooting:
      - Panoramica: troubleshooting/index.md
      - Vault Pods NotReady: troubleshooting/vault-pods-sealed-notready.md